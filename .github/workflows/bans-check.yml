name: Bans check
# Fetches the decrees the driving-ban calendars in bans/data were
# transcribed from (tools/tables/sources.json, table "bans") and checks
# each transcribed day and its hours against their text
# (tools/tables/check_bans.py). The Tables data workflow does the same
# daily with all its sources; this one takes minutes. Run from the Actions
# tab, or push to the bans-check branch.
on:
  workflow_dispatch:
    inputs:
      show:
        description: "Print a part of a fetched text in full, for transcribing it: id:start regex:end regex (e.g. es-bans-2026:ANEXO II:ANEXO III)"
        default: ""
  push:
    branches: [bans-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && break; sleep 20; done
      - name: Fetch
        run: |
          python3 -c "import json; d=json.load(open('tools/tables/sources.json')); d['sources']=[s for s in d['sources'] if s.get('table')=='bans']; json.dump(d, open('bans-sources.json','w'))"
          python3 -u tools/tables/fetch.py bans-sources.json out
          for f in out/*.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" || echo "not a PDF: $f"; done
          ls -la out
      - name: Show
        if: inputs.show != ''
        env:
          SHOW: ${{ inputs.show }}
        run: |
          python3 - <<'PY'
          import os, re
          id_, start, end = os.environ["SHOW"].split(":", 2)
          t = open(f"out/{id_}.txt", encoding="utf-8", errors="replace").read()
          a = re.search(start, t)
          b = re.search(end, t[a.end():]) if a else None
          print(t[a.start():a.end() + b.start()] if b else t[a.start():] if a else f"{start!r} not in {id_}")
          PY
      - name: Check
        run: |
          python3 tools/tables/check_bans.py out bans/data | tee check.txt
          ! grep -q "not found in" check.txt
      - name: Summary
        if: always()
        run: |
          [ -f check.txt ] && { echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          for f in out/*.txt; do echo "== $f"; head -c 6000 "$f"; done
