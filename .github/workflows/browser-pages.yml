name: Pages read in Chrome
# Weekly: fails when a page under tools/tables/browser/ (read in Chrome,
# since the workflow can't fetch it) is due to be read again, so GitHub
# mails the owner. See tools/tables/check_browser.py for each page's rule.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tables/check_browser.py --strict
