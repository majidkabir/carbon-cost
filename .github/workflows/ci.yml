name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
  tables:
    # The converter: the test tables convert to the test datasets; what
    # Publish data may publish on its own (tools/orct/publish.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/orct/test_publish.py
      - run: python3 tools/orct/test_expiring.py
      - run: pip install -q osmium shapely && python3 tools/roads/test_plnet.py && python3 tools/roads/test_hu.py
      - run: |
          for d in cost/testdata/synthetic/tables/*/; do
            v=$(basename "$d")
            python3 tools/orct/convert.py "$d" "/tmp/synthetic/$v" > /dev/null
            diff -r "/tmp/synthetic/$v" "cost/testdata/synthetic/orct/$v"
          done
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t carbon-cost .
      - run: docker run --rm carbon-cost rates | head -3
