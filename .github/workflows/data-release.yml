name: Data release
# Weekly (Monday 05:47 UTC) or by hand: when tariffs/data changed since the
# last release and the code didn't, raises RELEASE's patch number (v0.72.0 ->
# v0.72.1) and starts Release, so a new image and binaries carry the newer
# data. With code changes not yet released it does nothing: release those
# by hand, as before.
on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publish-data
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Release the data if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(tr -d '[:space:]' < RELEASE)
          if ! git rev-parse -q --verify "refs/tags/$last" >/dev/null; then echo "$last isn't released yet"; exit 0; fi
          code=$(git diff --name-only "$last" HEAD -- '*.go' go.mod go.sum Dockerfile | head -20)
          if [ -n "$code" ]; then
            echo "::warning title=Data release::code changed since $last; release by hand"; echo "$code"; exit 0
          fi
          changed=$(git diff --name-only "$last" HEAD -- 'tariffs/data/*/*.orct.json')
          if [ -z "$changed" ]; then echo "no data changes since $last"; exit 0; fi
          n=$(echo "$changed" | wc -l)
          IFS=. read -r maj min pat <<< "${last#v}"
          v="v$maj.$min.$((pat + 1))"
          echo "$v" > RELEASE
          git add RELEASE
          git -c user.name=actions -c user.email=actions@github.com commit -qm "$v: $n datasets updated since $last" -m "$(echo "$changed" | sed 's|^tariffs/data/|- |' | head -60)"
          git push -q origin HEAD:main
          gh workflow run release.yml --ref main -f version="$v"
          printf '## %s\n%s datasets changed since %s; Release started.\n' "$v" "$n" "$last" >> "$GITHUB_STEP_SUMMARY"
