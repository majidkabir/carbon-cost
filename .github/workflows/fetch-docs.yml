name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Bulgaria (Държавен вестник 49/2026) and Slovenia (Uradni list 76/2025) toll tariffs
        run: |
          note() { echo "::notice title=$1::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | head -c 60000)"; }
          ua="carbon-cost docs fetch"
          curl -fsSL -A "$ua" -o bg.html "https://dv.parliament.bg/DVWeb/showMaterialDV.jsp?idMat=243642" || echo bg failed
          html2text -utf8 -width 250 bg.html > bg.txt; wc -c bg.txt
          awk '/За ползване на платената пътна инфраструктура/{f=1} f' bg.txt | head -170 | note "bg-tariff-1"
          awk '/За ползване на платената пътна инфраструктура/{f=1} f' bg.txt | sed -n '171,340p' | note "bg-tariff-2"
          curl -fsSL -A "$ua" -o si.html "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2025-01-2726/cenik-cestnine-za-uporabo-cestninskih-cest" || echo si failed
          html2text -utf8 -width 250 si.html > si.txt; wc -c si.txt
          grep -n -i 'priloga\|pdf\|cestninski odsek\|R4' si.txt | head -40 | note "si-index"
          grep -o 'href="[^"]*\(pdf\|Priloga\|priloga\)[^"]*"' si.html | sort -u | head -20 | note "si-links"
