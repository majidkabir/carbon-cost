name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: ECB EUR/HUF on 1 October (Vhr 209/2013 § 3/A (2)-(3))
        run: |
          mkdir -p out
          curl -fsSL -A "carbon-cost docs fetch" -o hist.zip https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip
          unzip -p hist.zip > hist.csv
          python3 - <<'PY' > out/eurhuf.txt
          import csv
          r = list(csv.DictReader(open("hist.csv")))
          for row in r:
              d = row["Date"]
              if d[5:] in ("09-27","09-28","09-29","09-30","10-01","10-02","10-03") and d[:4] in ("2021","2022","2023","2024","2025"):
                  print(d, row[" HUF"] if " HUF" in row else row.get("HUF"))
          PY
          cat out/eurhuf.txt
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
