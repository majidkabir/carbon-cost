name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Serbia toll price list and OSM toll booths
        run: |
          mkdir -p out
          sudo apt-get install -y -qq osmium-tool poppler-utils >/dev/null
          for f in cene_putarina_lat cene_putarina_obilaznica_lat; do
            curl -fsSL -A "carbon-cost docs fetch" -o $f.pdf "https://www.putevi-srbije.rs/images/pdf/$f.pdf"
            pdftotext -layout $f.pdf out/rs-$f.txt
            pdfinfo $f.pdf | head -5
          done
          curl -fsSL -o rs.pbf https://download.geofabrik.de/europe/serbia-latest.osm.pbf
          osmium tags-filter -O -o b.pbf rs.pbf n/barrier=toll_booth n/highway=motorway_junction
          osmium export -O -f geojsonseq -o out/rs-booths.geojsonseq b.pbf
          wc -l out/*
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
