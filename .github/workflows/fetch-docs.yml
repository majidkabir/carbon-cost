name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Scottish ferry lines and terminals (Overpass)
        run: |
          mkdir -p out
          curl -fsSL --retry 3 -A "carbon-cost tables fetch (github.com/majidkabir/carbon-cost)" -o out/sct-ferries.json "https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%5Btimeout%3A180%5D%3B%28way%5B%22route%22%3D%22ferry%22%5D%2855.5%2C-7.8%2C58.6%2C-4.6%29%3Brelation%5B%22route%22%3D%22ferry%22%5D%2855.5%2C-7.8%2C58.6%2C-4.6%29%3Bnwr%5B%22amenity%22%3D%22ferry_terminal%22%5D%2855.5%2C-7.8%2C58.6%2C-4.6%29%3B%29%3Bout%20geom%20tags%3B" && echo ok || echo FAILED
          ls -la out
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
