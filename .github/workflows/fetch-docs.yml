name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Danish domestic ferries' freight prices, and OpenStreetMap's lines
        run: |
          mkdir -p out
          UA="carbon-cost tables fetch (+https://github.com/majidkabir/carbon-cost)"
          get() { curl -sS -L -A "$UA" -m 120 -o "out/$1" -w "%{http_code} %{size_download} $1\n" "$2" || true; }
          get samsoelinjen.html https://www.samsoelinjen.dk/alt-det-praktiske/fragt
          get alslinjen.html https://www.alslinjen.dk/alt-det-praktiske/fragt
          get fanoelinjen.html https://www.fanoelinjen.dk/alt-det-praktiske/fragt
          get langelandslinjen.html https://www.langelandslinjen.dk/alt-det-praktiske/fragt
          get molslinjen.html https://www.molslinjen.dk/alt-det-praktiske/fragt
          get tilsamsoe-lastbiler.html https://www.tilsamsoe.dk/priser-lastbiler/
          get tilsamsoe-gods.html https://www.tilsamsoe.dk/erhverv-og-gods/
          for f in out/*.html; do html2text -utf8 "$f" > "${f%.html}.txt" 2>/dev/null || true; done
          ov() { for w in 30 60 120 240 480; do curl -sS -A "$UA" -m 300 -o "out/$1" -w "%{http_code} %{size_download} $1\n" "$2"; head -c 1 "out/$1" | grep -q '{' && return; sleep $w; done; }
          ov dk-ferries-osm.json "https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%5Btimeout%3A180%5D%3B%28way%5B%22route%22%3D%22ferry%22%5D%2854.8%2C8.3%2C56.3%2C11.4%29%3Bnwr%5B%22amenity%22%3D%22ferry_terminal%22%5D%2854.8%2C8.3%2C56.3%2C11.4%29%3Bnode%5B%22place%22%5D%5B%22name%22~%22%5E%28Kalundborg%7CBallen%7CB%C3%B8jden%7CFynshav%7CEsbjerg%7CNordby%7CSpodsbjerg%7CT%C3%A5rs%7CHou%7CS%C3%A6lvig%7CAarhus%7CEbeltoft%7CSj%C3%A6llands%20Odde%29%24%22%5D%2854.8%2C8.3%2C56.3%2C11.4%29%3B%29%3Bout%20geom%20tags%3B"
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
