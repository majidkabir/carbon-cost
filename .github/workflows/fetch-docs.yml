name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Hungarian toll segments (Magyar Közlöny 143/2025, 34/2025 ÉKM annex 1)
        run: |
          mkdir -p out
          curl -fsSL -A "carbon-cost docs fetch" -o mk143.pdf "https://magyarkozlony.hu/dokumentumok/ffc3529aaa9c6075ef082089b3ec049444bc554a/letoltes"
          pdftotext -layout mk143.pdf mk143.txt
          python3 - <<'PY'
          import re, json
          t = open("mk143.txt", encoding="utf-8").read()
          rows = []
          for l in t.split("\n"):
              m = re.match(r"\s*(\d+)\.?\s+(M\d+|\d+)\s+(\S+)\s+(\d+ \+ \d+)\s+(\d+ \+ \d+)\s+(\d+)\s+(gyorsforgalmi|főút)\s+([\d,]+)\s*$", l)
              if m:
                  rows.append([m.group(2), m.group(3), m.group(4), m.group(5), int(m.group(6)), m.group(7), float(m.group(8).replace(",", "."))])
          json.dump(rows, open("out/hu-segments.json", "w"), ensure_ascii=False)
          print(len(rows))
          PY
          grep -c 'gyorsforgalmi\|főút' mk143.txt
          grep -m5 'gyorsforgalmi' mk143.txt
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
