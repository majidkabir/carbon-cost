name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Bornholmslinjen's freight prices
        run: |
          mkdir -p out
          UA="carbon-cost tables fetch (+https://github.com/majidkabir/carbon-cost)"
          g() { curl -sS -L -A "$UA" -m 120 -o "out/$1" -w "%{http_code} %{size_download} $1\n" "$2" || echo "FAIL $1"; }
          g bornholm-freight.html "https://bornholmslinjen.com/practical-information/freight"
          g bornholm-freight-da.html "https://bornholmslinjen.dk/praktisk-information/fragt"
          g bornholm-fragtpriser-2026-eng.pdf "https://cdn.molslinjen.dk/1uxbpblk/fragtpriser-2026-eng.pdf"
          for f in out/*.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" || true; done
          grep -o 'https://cdn.molslinjen.dk/[^"]*\.pdf' out/bornholm-freight*.html | sort -u
          cat out/bornholm-fragtpriser-2026-eng.txt | head -150
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
