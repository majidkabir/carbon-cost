name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: NVDB ferry routes and quays, Stortinget's answer on ferry zones
        run: |
          mkdir -p out
          H='-H X-Client:carbon-cost-docs-fetch -H Accept:application/json'
          curl -fsSL $H -o out/nvdb-770.json "https://nvdbapiles.atlas.vegvesen.no/vegobjekter/api/v4/vegobjekter/770?inkluder=egenskaper,relasjoner,metadata&antall=1000" || echo FAILED 770
          curl -fsSL $H -o out/nvdb-64.json "https://nvdbapiles.atlas.vegvesen.no/vegobjekter/api/v4/vegobjekter/64?inkluder=egenskaper,relasjoner,geometri,lokasjon,metadata&srid=4326&antall=1000" || echo FAILED 64
          curl -fsSL $H -o out/nvdb-type-64.json "https://nvdbapiles.atlas.vegvesen.no/datakatalog/api/v1/vegobjekttyper/64" || true
          curl -fsSL -A "Mozilla/5.0" -o out/stortinget-699.pdf "https://www.stortinget.no/globalassets/pdf/dokumentserien/2025-2026/dok15-202526-0699-vedlegg.pdf" && pdftotext -layout out/stortinget-699.pdf out/stortinget-699.txt || echo FAILED stortinget
          get() { curl -fsSL --retry 3 -A "Mozilla/5.0" -o "out/$1" "$2" && echo "ok $1" || echo "FAILED $1 $2"; }
          get no-ferje-autopass-pris.pdf "https://www.vegvesen.no/globalassets/fag/trafikk/ferje/pris---autopass-regulativ---fullpris---01.01.2026.pdf"
          get no-ferje-autopass-reg.pdf "https://www.vegvesen.no/globalassets/fag/trafikk/ferje/autopass-reg.-for-ferje-fra-01.01.2026.pdf"
          curl -fsSL --retry 3 -A "carbon-cost tables fetch (github.com/majidkabir/carbon-cost)" -o out/no-ferry-ways.json "https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%5Btimeout%3A180%5D%3B%28way%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C59.171%2C5.454%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C59.137%2C5.588%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C59.233%2C6.166%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C59.262%2C6.159%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C59.253%2C6.095%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C60.147%2C5.428%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C59.968%2C5.334%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.846%2C6.082%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.864%2C6.08%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.105%2C5.507%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.055%2C5.506%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.21%2C6.538%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.215%2C6.565%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.207%2C6.598%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.175%2C6.637%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.149%2C7.385%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C61.16%2C7.337%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C62.375%2C6.332%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C62.414%2C6.328%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C62.652%2C7.085%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C62.737%2C7.17%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C62.12%2C6.033%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C62.145%2C6.064%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C63.068%2C8.228%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C63.053%2C8.125%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C67.288%2C14.397%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C67.9%2C13.045%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C67.505%2C12.072%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C67.652%2C12.71%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C68.224%2C16.073%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C68.42%2C15.993%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C68.047%2C16.08%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C68.093%2C16.358%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C68.232%2C16.236%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C59.43%2C10.654%29%3Bway%5B%22route%22%3D%22ferry%22%5D%28around%3A1500%2C59.412%2C10.488%29%3B%29%3Bout%20geom%20tags%3B" && echo ok ways || echo FAILED ways
          get rs-sg-23-2023.pdf "https://slgl.pravno-informacioni-sistem.rs/api/prins/viewdoc?uuid=c6a3b10a-423d-467e-b3e3-553a105a386c"
          get rs-sg-87-2023.pdf "https://slgl.pravno-informacioni-sistem.rs/api/prins/viewdoc?uuid=22015e89-6c0b-4b47-9ca7-dddc816424eb"
          get rs-sg-119-2023.pdf "https://slgl.pravno-informacioni-sistem.rs/api/prins/viewdoc?uuid=12d856fe-62e5-423b-bfd7-320f8e8e1376"
          get rs-sg-58-2024.pdf "https://slgl.pravno-informacioni-sistem.rs/api/prins/viewdoc?uuid=8359a1f7-bdb4-482e-95e0-51fa20fbf191"
          get rs-sg-107-2024.pdf "https://slgl.pravno-informacioni-sistem.rs/api/prins/viewdoc?uuid=44027ec0-5ae2-4088-b30e-07beb4047b5d"
          get rs-sg-58-2025.pdf "https://slgl.pravno-informacioni-sistem.rs/api/prins/viewdoc?uuid=ef5d2388-51f8-430a-85c3-90e3cac5a347"
          get rs-sg-120-2025.pdf "https://slgl.pravno-informacioni-sistem.rs/api/prins/viewdoc?uuid=6f685da3-bddd-4a26-9298-f28f4da8d068"
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-srp >/dev/null && pip install -q opencv-python-headless pytesseract pymupdf
          for k in 119-2023 107-2024 58-2025 58-2024; do python3 tools/history/rs_gazette.py out/rs-sg-$k.pdf out/rs-sg-$k.json || echo "FAILED ocr $k"; done
          get rs-obilaznica.pdf "https://www.putevi-srbije.rs/images/pdf/cene_putarina_obilaznica_lat.pdf"
          get rs-cene-cyr.pdf "https://www.putevi-srbije.rs/images/pdf/cene_putarina.pdf"
          for f in out/rs-*.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt"; done
          get no-ferje-mh-pris.pdf "https://cdn.sanity.io/files/ufla9djl/production/5620c5955d8c702afa5cb2b98fae987d75981e97.pdf"
          get no-ferje-mh-reg.pdf "https://cdn.sanity.io/files/ufla9djl/production/e817a1a582716393c9fe00f58c0b9d96382a82d7.pdf"
          get no-ferje-mh-page.html "https://torghatten.no/en/our-routes/BF"
          for f in out/no-ferje-*.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt"; done
          python3 - <<'PY'
          import json
          for f in ("out/nvdb-770.json", "out/nvdb-64.json"):
              d = json.load(open(f))
              print(f, len(d.get("objekter", [])), d.get("metadata", {}).get("returnert"), d.get("metadata", {}).get("neste", {}).get("href"))
          t = json.load(open("out/nvdb-type-64.json"))
          print([e.get("navn") for e in t.get("egenskapstyper", [])])
          d = json.load(open("out/nvdb-770.json"))
          for o in d["objekter"][:3]:
              print(json.dumps(o, ensure_ascii=False)[:1500])
          PY
          ls -la out
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
