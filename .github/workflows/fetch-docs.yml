name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
jobs:
  junctions:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool jq >/dev/null
      - name: Austrian motorway junctions and border crossings (OpenStreetMap)
        run: |
          curl -fsSL -o at.osm.pbf https://download.geofabrik.de/europe/austria-latest.osm.pbf
          osmium tags-filter -o j.osm.pbf at.osm.pbf n/highway=motorway_junction
          osmium export -f geojsonseq -o j.geojsonseq j.osm.pbf
          pat='Pyhrn|Ardning|St\. Michael|Sankt Michael|Übelbach|Flachau|Zederhaus|Rennweg|Jakob|Amras|Wilten|Innsbruck|Zenzenhof|Patsch|Schönberg|Matrei|Steinach|Nösslach|Brenner|Anton|Langen|Kufstein'
          jq -c 'select(.properties.name != null) | select(.properties.name|test("'"$pat"'")) | [.properties.name, .properties.ref, .geometry.coordinates[1], .geometry.coordinates[0]]' j.geojsonseq | sort -u > found.txt
          wc -l found.txt
          echo "::notice title=junctions::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' found.txt | head -c 60000)"
