name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Estonia's state ferry price annex, the Strait of Messina's Italian freight pages
        run: |
          mkdir -p out
          UA="carbon-cost tables fetch (+https://github.com/majidkabir/carbon-cost)"
          g() { curl -sS -L -A "$UA" -m 120 -o "out/$1" -w "%{http_code} %{size_download} $1\n" "$2" || echo "FAIL $1"; }
          g ee-lisa.pdf "https://www.riigiteataja.ee/aktilisa/1150/9202/6002/MM_m109_lisa.pdf"
          pdftotext -layout out/ee-lisa.pdf out/ee-lisa.txt || true
          cat out/ee-lisa.txt | head -80
          for pg in tariffe-veicolo-commerciale condizioni-di-trasporto; do
            g "ct-it-$pg.html" "https://www.carontetourist.it/it/stretto-di-messina/merci/$pg"
            html2text -utf8 "out/ct-it-$pg.html" > "out/ct-it-$pg.txt" || true
          done
          g ct-it-merci.html "https://www.carontetourist.it/it/stretto-di-messina/merci"
          grep -o 'href="/it/stretto-di-messina/merci/[^"]*"' out/ct-it-merci.html | sort -u | head -40
          grep -o 'href="[^"]*\.pdf[^"]*"' out/ct-it-merci.html out/ct-freight.html 2>/dev/null | sort -u | head -20
          grep -i -o '.\{60\}IVA.\{60\}' out/ct-it-*.txt | head -10
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
