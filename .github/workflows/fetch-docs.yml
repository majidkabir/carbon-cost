name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Felbertauern Mautordnung pages as images, Norwegian ferry tariffs 2026
        run: |
          mkdir -p out
          get() { curl -fsSL --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36" -o "out/$1" "$2" && echo "ok $1 $(wc -c < out/$1)" || echo "FAILED $1 $2"; }
          get at-felbertauern-mautordnung-2025.pdf "https://assets.felbertauernstrasse.at/2025/05/Mautordnung.pdf"
          get at-felbertauern-mautordnung-2016.pdf "https://www.felbertauernstrasse.at/wp-content/uploads/2016/04/mautordnung-1.pdf"
          get no-autopass-reg-2026.pdf "https://www.vegvesen.no/globalassets/fag/trafikk/ferje/autopass-reg.-for-ferje-fra-01.01.2026.pdf"
          get no-autopass-pris-2026.pdf "https://www.vegvesen.no/globalassets/fag/trafikk/ferje/pris---autopass-regulativ---fullpris---01.01.2026.pdf"
          get no-markedsoversikt-2026.pdf "https://www.vegvesen.no/globalassets/fag/trafikk/ferje/markedsoversikt-for-ferje-per-1.-januar-2026.pdf"
          for f in out/*.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" || true; pdfinfo "$f" | grep Pages; done
          for f in out/at-felbertauern-mautordnung-*.pdf; do pdftoppm -r 80 -f 1 -l 4 -png "$f" "${f%.pdf}-p" || true; done
          ls -la out
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
