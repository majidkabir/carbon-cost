name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: NVDB ferry object types
        run: |
          mkdir -p out
          curl -fsSL -H "X-Client: carbon-cost docs fetch" -H "Accept: application/json" -o out/nvdb-types.json "https://nvdbapiles.atlas.vegvesen.no/datakatalog/api/v1/vegobjekttyper" || echo FAILED types
          python3 - <<'PY'
          import json
          d = json.load(open("out/nvdb-types.json"))
          for t in d:
              if "erje" in t.get("navn", "") or "Takst" in t.get("navn", ""):
                  print(t["id"], t["navn"])
          PY
          for id in $(python3 -c "import json;print(' '.join(str(t['id']) for t in json.load(open('out/nvdb-types.json')) if 'erje' in t.get('navn','')))"); do
            curl -fsSL -H "X-Client: carbon-cost docs fetch" -H "Accept: application/json" -o out/nvdb-type-$id.json "https://nvdbapiles.atlas.vegvesen.no/datakatalog/api/v1/vegobjekttyper/$id" || true
            python3 -c "import json;d=json.load(open('out/nvdb-type-$id.json'));print($id, d.get('navn'), [e.get('navn') for e in d.get('egenskapstyper',[])])"
            curl -fsSL -H "X-Client: carbon-cost docs fetch" -H "Accept: application/json" -o out/nvdb-objs-$id.json "https://nvdbapiles.atlas.vegvesen.no/vegobjekter/api/v4/vegobjekter/$id?inkluder=egenskaper,metadata&antall=5" || true
          done
          ls -la out
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
