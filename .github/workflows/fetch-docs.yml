name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Romania TollRo order (OMTI 1925/2025)
        run: |
          mkdir -p out
          for id in 302972; do
            curl --http1.1 -fsSL -A "carbon-cost docs fetch" -o ro-$id.html "https://legislatie.just.ro/Public/DetaliiDocument/$id" || echo fail $id
            python3 -c "import re,html,sys;t=open('ro-$id.html',encoding='utf-8',errors='replace').read();t=re.sub(r'<(script|style)[^>]*>.*?</\\1>','',t,flags=re.S);t=re.sub(r'<br\\s*/?>|</(p|tr|div|td|th|li)>','\\n',t);t=html.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'[ \\t]+',' ',t);t=re.sub(r'\\n\\s*\\n+','\\n',t);open('out/ro-$id.txt','w').write(t)"
            grep -o 'DetaliiDocument[A-Za-z]*/[0-9]*' ro-$id.html | sort -u > out/ro-$id-links.txt
          done
          wc -c out/ro-*
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
