name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Slovak toll rate annexes (NV 418/2024 Z. z.)
        run: |
          mkdir -p out
          for f in 5704373 5704377 5704381 5704385 5704389; do
            curl -fsSL -A "carbon-cost docs fetch" -o "$f.pdf" "https://static.slov-lex.sk/pdf/prilohy/SK/ZZ/2024/418/20250701_${f}-2.pdf" && pdftotext -layout "$f.pdf" "out/sk-$f.txt"
          done
          ls -la out
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
