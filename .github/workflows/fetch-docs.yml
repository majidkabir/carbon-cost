name: Fetch documents
# Pulls data that isn't reachable from every machine and prints it as
# annotations. Push to the fetch-docs branch.
on:
  push:
    branches: [fetch-docs]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils html2text >/dev/null
      - name: Bulgaria (Държавен вестник 49/2026) and Slovenia (Uradni list 76/2025) toll tariffs
        run: |
          note() { echo "::notice title=$1::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | head -c 60000)"; }
          ua="carbon-cost docs fetch"
          curl -fsSL -A "$ua" -o bg.html "https://dv.parliament.bg/DVWeb/showMaterialDV.jsp?idMat=243642"
          pip install -q pandas lxml >/dev/null 2>&1
          python3 - <<'PY' > bg.csv
          import pandas as pd
          for i, t in enumerate(pd.read_html("bg.html", encoding="windows-1251") + pd.read_html("bg.html")):
              if t.shape[1] >= 15:
                  t = t.fillna("")
                  for r in t.itertuples(index=False):
                      print(i, "|".join(str(x).strip()[:28] for x in r))
                  break
          PY
          wc -l bg.csv
          curl -fsSL -A "$ua" -o si.pdf "https://www.uradni-list.si/_pdf/2025/Ur/u2025076.pdf"
          pdftotext -layout si.pdf si.txt
          mkdir -p out && cp bg.csv si.txt out/
      - name: Push the texts to the docs-out branch
        run: |
          cd out && git init -q && git checkout -q -b docs-out && git add -A
          git -c user.name=fetch-docs -c user.email=fetch-docs@users.noreply.github.com commit -qm "fetched documents"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" docs-out
