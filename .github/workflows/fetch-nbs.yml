name: Fetch NBS
on:
  push:
    branches: [fetch-nbs]
jobs:
  nbs:
    runs-on: ubuntu-latest
    steps:
      - name: NBS exchange rate web app forms
        run: |
          U=https://webappcenter.nbs.rs/ExchangeRateWebApp
          for p in "ExchangeRate/IndexPeriod?isSearchExecuted=false" "ExchangeRate/IndexByDate?isSearchExecuted=false" "ExchangeRate/CurrentMiddleRate"; do
            echo "===== $p"
            curl -sS -c jar -b jar -A "Mozilla/5.0" "$U/$p" -o page.html -w "%{http_code} %{content_type}\n"
            python3 - <<'PY'
          import re
          h = open("page.html", encoding="utf-8", errors="replace").read()
          for m in re.finditer(r"<form[\s\S]*?</form>", h):
              f = m.group(0)
              print(re.sub(r"\s+", " ", re.sub(r"<option[^>]*>[^<]*</option>", "", f))[:6000])
          for m in re.finditer(r"<a [^>]*href=\"([^\"]*(?:Export|Xml|xml|Csv|csv|Excel|Pdf|Print)[^\"]*)\"", h):
              print("LINK", m.group(1))
          for m in re.finditer(r"<script[^>]*src=\"([^\"]+)\"", h):
              print("SCRIPT", m.group(1))
          PY
          done
