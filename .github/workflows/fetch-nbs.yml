name: Fetch NBS
on:
  push:
    branches: [fetch-nbs]
jobs:
  nbs:
    runs-on: ubuntu-latest
    steps:
      - name: NBS exchange rate web app, period search
        run: |
          U=https://webappcenter.nbs.rs/ExchangeRateWebApp/ExchangeRate/IndexPeriod
          curl -sS -A "Mozilla/5.0" "$U?isSearchExecuted=false" -o page.html
          python3 - <<'PY'
          import re
          h = open("page.html", encoding="utf-8").read()
          for name in ("CurrencyCode", "ExchangeRateListTypeID", "WorkingDays"):
              m = re.search(r'<select[^>]*name="%s"[^>]*>([\s\S]*?)</select>' % name, h)
              print(name, re.findall(r'<option[^>]*value="([^"]*)"[^>]*>([^<]*)<', m.group(1))[:60])
          PY
          curl -sS -A "Mozilla/5.0" "$U?isSearchExecuted=true&DateFrom=28.12.2023.&DateTo=05.01.2024.&CurrencyCode=978&ExchangeRateListTypeID=3&WorkingDays=2" -o r.html -w "%{http_code} %{size_download}\n"
          python3 - <<'PY'
          import re
          h = open("r.html", encoding="utf-8").read()
          for m in re.finditer(r"11[0-9],[0-9]{4}", h):
              print("AT", m.start(), re.sub(r"\s+", " ", h[max(0, m.start() - 600):m.start() + 200]))
              break
          print(len(re.findall(r"11[0-9],[0-9]{4}", h)), "rates")
          i = h.find("searchParamForm")
          print(re.sub(r"\s+", " ", h[i:i + 200]))
          for m in re.finditer(r'(?:href|action|url)\s*[=:]\s*["\']([^"\']+)["\']', h):
              if "Export" in m.group(1) or "Excel" in m.group(1) or "Print" in m.group(1) or "Pdf" in m.group(1) or "Csv" in m.group(1) or "Xml" in m.group(1):
                  print("LINK", m.group(1))
          PY
