name: France data
# Fetches the French toll tariffs and toll stations listed in
# tools/fr/sources.json (tools/fr/fetch.py) and pushes them, with a
# manifest, to the fr-out branch. Push to the fr-data branch to run it.
on:
  push:
    branches: [fr-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils osmium-tool && pip install -q pyproj pymupdf
      - name: Fetch
        run: |
          mkdir -p out
          python3 tools/fr/fetch.py tools/fr/sources.json out
          curl -fsSL -o fr.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf
          osmium tags-filter -O -o booths.pbf fr.pbf n/barrier=toll_booth n/highway=motorway_junction
          osmium export -O -f geojsonseq -o out/osm-booths.geojsonseq booths.pbf
          rm fr.pbf booths.pbf
      - name: Parse and build
        run: |
          python3 tools/fr/parse.py tools/fr/documents.json out out/pairs.csv
          gares=$(ls out/stations/Gares-Peage_20* | sort | tail -1)
          python3 tools/fr/stations.py out/pairs.csv "$gares" tools/fr/aliases.json out/osm-booths.geojsonseq out/stations.json | tee out/stations-report.txt
          python3 tools/fr/build.py out/pairs.csv out/stations.json out/manifest.json out/fr.json | tee out/build-report.txt
      - name: Push
        run: |
          cd out
          git init -q -b fr-out && git add -A
          git -c user.name=actions -c user.email=actions@github.com commit -qm "France toll data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fr-out
