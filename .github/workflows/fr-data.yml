name: France data
# Fetches the French toll tariffs and toll stations listed in
# tools/fr/sources.json (tools/fr/fetch.py), builds the table, converts it
# to ORCT, compares it with tariffs/data, and pushes it all, with a
# manifest, to the fr-out branch. Push to the fr-data branch to run it.
on:
  push:
    branches: [fr-data]
  # Daily (02:49 UTC); Publish data then publishes what changed only in
  # OpenStreetMap's positions.
  schedule:
    - cron: "49 2 * * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils osmium-tool && break; [ $i = 5 ] && exit 1; sleep 30; done && pip install -q pyproj pymupdf
      - name: Fetch
        run: |
          mkdir -p out
          python3 tools/fr/fetch.py tools/fr/sources.json out
          # Geofabrik refuses connections from GitHub's runners for minutes at a time: retry for ~10 minutes;
          # the extract is 5 GB (about 35 minutes at times): a try stops after 50 minutes, the whole download after 60, and the last run's toll booths are used.
          if timeout 3600 curl -fsSL --retry 10 --retry-delay 60 --retry-all-errors --max-time 3000 -o fr.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf; then
            osmium tags-filter -O -o booths.pbf fr.pbf n/barrier=toll_booth n/highway=motorway_junction
            osmium export -O -f geojsonseq -o out/osm-booths.geojsonseq booths.pbf
            rm fr.pbf booths.pbf
          else
            echo "::warning title=Geofabrik::the France extract wasn't downloaded: the last run's toll booths (fr-out) are used"
            git fetch -q --depth 1 origin fr-out && git show FETCH_HEAD:osm-booths.geojsonseq > out/osm-booths.geojsonseq
          fi
      - name: Parse and build
        run: |
          python3 tools/fr/parse.py tools/fr/documents.json out out/pairs.csv
          gares=$(ls out/stations/Gares-Peage_20* | sort | tail -1)
          python3 tools/fr/stations.py out/pairs.csv "$gares" tools/fr/aliases.json out/osm-booths.geojsonseq out/stations.json | tee out/stations-report.txt
          python3 tools/fr/build.py out/pairs.csv out/stations.json out/manifest.json out/fr.json | tee out/build-report.txt
      - name: Convert to ORCT and compare
        # The table becomes an ORCT dataset right away; only that is kept
        # (tariffs/data/fr).
        run: |
          mkdir -p out/tables
          # One table per tariff period of the year (each prices the
          # documents in force on its first day); the last is fr.json.
          python3 tools/fr/build.py --periods out/pairs.csv out/stations.json out/manifest.json out/tables | tee -a out/build-report.txt
          v=$(python3 -c "import json; print(json.load(open('out/fr.json'))['valid_from'])")
          cmp out/fr.json "out/tables/fr-$v.json"
          python3 tools/orct/convert.py out/tables out/orct --commit "$GITHUB_SHA"
          python3 tools/orct/check_lossless.py out/tables out/orct
          sh tools/orct/compare.sh out/orct | tee out/tables/compare.txt
      - name: Push
        run: |
          cd out
          git init -q -b fr-out && git add -A
          git -c user.name=actions -c user.email=actions@github.com commit -qm "France toll data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fr-out
