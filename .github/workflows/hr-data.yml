name: Croatia data
# Fetches HAC's toll price lists and Croatia's OpenStreetMap toll booths
# and motorway junctions, and pushes them to the hr-out branch. Push to
# the hr-data branch to run it.
on:
  push:
    branches: [hr-data]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && break; [ $i = 5 ] && exit 1; sleep 30; done
      - name: Fetch
        run: |
          mkdir -p out
          curl -fsSL -o hr.pbf https://download.geofabrik.de/europe/croatia-latest.osm.pbf
          osmium tags-filter -O -o b.pbf hr.pbf n/barrier=toll_booth n/highway=motorway_junction
          osmium export -O -f geojsonseq -o booths.geojsonseq b.pbf
          python3 tools/hr/fetch.py booths.geojsonseq out
      - name: Push
        run: |
          cd out
          git init -q -b hr-out && git add -A
          git -c user.name=actions -c user.email=actions@github.com commit -qm "Croatia toll data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" hr-out
