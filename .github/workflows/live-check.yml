name: Live check
# Runs Sootcase (v0.10.1, else main) with real OSRM routing on a map
# extract, then prices trips with carbon-cost and prints them as
# annotations. Run from the Actions tab, or push to the live-check branch.
on:
  workflow_dispatch:
  push:
    branches: [live-check]
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dk-de
            maps: europe/denmark europe/germany/schleswig-holstein europe/germany/hamburg
          - name: be
            maps: europe/belgium
          - name: at
            maps: europe/austria
          - name: ch
            maps: europe/switzerland europe/liechtenstein
          - name: cz
            maps: europe/czech-republic
          - name: sk
            maps: europe/slovakia
          - name: si
            maps: europe/slovenia europe/austria
          - name: bg
            maps: europe/bulgaria
          - name: hu
            maps: europe/hungary
          - name: ro
            maps: europe/romania
          - name: hr
            maps: europe/croatia
          - name: rs
            maps: europe/serbia
          - name: fr
            maps: europe/france/bourgogne
          - name: fr-south
            maps: europe/france/provence-alpes-cote-d-azur europe/france/languedoc-roussillon
          - name: fr-west
            maps: europe/france/pays-de-la-loire
          - name: fr-north
            maps: europe/france/nord-pas-de-calais europe/france/picardie
          - name: fr-normandy
            maps: europe/france/haute-normandie europe/france/basse-normandie
          - name: fr-alps
            maps: europe/france/rhone-alpes
          - name: fr-sw
            maps: europe/france/aquitaine europe/france/midi-pyrenees
          - name: pl
            maps: europe/poland/dolnoslaskie europe/poland/opolskie europe/poland/slaskie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o cc ./cmd/carbon-cost
      - name: Sootcase
        run: |
          git clone -q --depth 1 --branch v0.10.1 https://github.com/majidkabir/sootcase sootcase-src 2>/dev/null \
            || { rm -rf sootcase-src; git clone -q --depth 1 https://github.com/majidkabir/sootcase sootcase-src; }
          git -C sootcase-src log --oneline -1
      - name: Map
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool >/dev/null
          mkdir -p maps && cd maps
          for r in ${{ matrix.maps }}; do
            curl -fsSL -o "$(basename $r).osm.pbf" "https://download.geofabrik.de/$r-latest.osm.pbf"
          done
          if [ "$(ls *.osm.pbf | wc -l)" -gt 1 ]; then osmium merge -o region.osm.pbf *.osm.pbf; else mv *.osm.pbf region.osm.pbf; fi
          ls -la
      - name: Start stack
        working-directory: sootcase-src
        run: |
          (cd ../maps && python3 -m http.server 8000 >/dev/null 2>&1 &)
          ip=$(hostname -I | awk '{print $1}')
          export OSRM_PBF_URL="http://$ip:8000/region.osm.pbf" SEA_RESOLUTION_KM=100
          export SOOTCASE_FACTORS="desnz-2026,nl-iww-2026,eu-mrv-2024,glec-3.3"
          docker compose up -d --build
          for i in $(seq 1 240); do
            if curl -fs localhost:8080/healthz >/dev/null; then echo healthy after $((i*5))s; exit 0; fi
            sleep 5
          done
          docker compose logs --tail 50; exit 1
      - name: Trips
        run: |
          set +e
          export SOOTCASE_URL=http://localhost:8080
          run() {
            name="${{ matrix.name }}/$1"; shift
            out=$(./cc calc -date 2026-11-04 -cargo-kg 20000 -eua 75 "$@" 2>&1); code=$?
            echo "== $name (exit $code)"; echo "$out"
            echo "::notice title=$name::exit $code%0A$(echo "$out" | grep -v 'counted as on tolled roads' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          }
          if [ "${{ matrix.name }}" = dk-de ]; then
            run cph-ham -from DKCPH -to DEHAM -compare 1,4,5 -trips-per-year 200
            run cph-ham-mrv -from DKCPH -to DEHAM -tare-kg 15000
            run aarhus-hamburg -from DKAAR -to DEHAM
            run copenhagen-odense -from 55.6761,12.5683 -to 55.4038,10.4024
            run copenhagen-odense-etc -from 55.6761,12.5683 -to 55.4038,10.4024 -etc
          elif [ "${{ matrix.name }}" = at ]; then
            run kufstein-brenner -from 47.5850,12.1600 -to 47.0035,11.5080
            run kufstein-brenner-night -from 47.5850,12.1600 -to 47.0035,11.5080 -night
            run salzburg-villach -from ATSZG -to 46.6100,13.8500
            run linz-graz -from ATLNZ -to ATGRZ
            run arlberg -from 47.1400,10.5600 -to 47.1600,9.8200
          elif [ "${{ matrix.name }}" = ch ]; then
            run basel-chiasso -from 47.5596,7.5886 -to 45.8350,9.0300
            run basel-chiasso-euro5-44t -from 47.5596,7.5886 -to 45.8350,9.0300 -euro 5 -mass-kg 44000
            run sargans-schaanwald -from 47.0450,9.4400 -to 47.2150,9.5650
            run zev -from 47.5596,7.5886 -to 45.8350,9.0300 -co2-class 5
          elif [ "${{ matrix.name }}" = cz ]; then
            run prague-brno -from 50.0755,14.4378 -to 49.1951,16.6068
            run prague-brno-class4 -from 50.0755,14.4378 -to 49.1951,16.6068 -co2-class 4 -motorway-share CZ=0.9
          elif [ "${{ matrix.name }}" = pl ]; then
            run wroclaw-gliwice -from 51.1079,17.0385 -to 50.2945,18.6714
            run wroclaw-gliwice-10t-euro3 -from 51.1079,17.0385 -to 50.2945,18.6714 -mass-kg 10000 -axles 2 -euro 3
          elif [ "${{ matrix.name }}" = sk ]; then
            run bratislava-zilina -from 48.1486,17.1077 -to 49.2231,18.7394
            run bratislava-zilina-co2class4 -from 48.1486,17.1077 -to 49.2231,18.7394 -co2-class 4
          elif [ "${{ matrix.name }}" = si ]; then
            run sentilj-koper -from 46.6770,15.6470 -to 45.5480,13.7650
            run ljubljana-obrezje -from 46.0569,14.5058 -to 45.8540,15.6900
            run villach-ljubljana-karavanke -from 46.6100,13.8500 -to 46.0569,14.5058
            run ljubljana-obrezje-zev-3axles -from 46.0569,14.5058 -to 45.8540,15.6900 -co2-class 5 -axles 3 -mass-kg 26000
          elif [ "${{ matrix.name }}" = hu ]; then
            run budapest-gyor -from 47.4979,19.0402 -to 47.6875,17.6504
            run budapest-gyor-co2class4 -from 47.4979,19.0402 -to 47.6875,17.6504 -co2-class 4
            run budapest-szeged-euro3-2axles -from 47.4979,19.0402 -to 46.2530,20.1414 -euro 3 -axles 2 -mass-kg 12000
          elif [ "${{ matrix.name }}" = ro ]; then
            run bucharest-pitesti -from 44.4268,26.1025 -to 44.8565,24.8692
            run bucharest-brasov -from 44.4268,26.1025 -to 45.6427,25.5887
            run bucharest-brasov-zev -from 44.4268,26.1025 -to 45.6427,25.5887 -co2-class 5
          elif [ "${{ matrix.name }}" = hr ]; then
            run zagreb-split -from 45.8150,15.9819 -to 43.5081,16.4402
            run zagreb-rijeka-3axles -from 45.8150,15.9819 -to 45.3271,14.4422 -axles 3 -mass-kg 26000
            run slovenia-border-zagreb -from 45.8470,15.6850 -to 45.8150,15.9819
            run rijeka-pula -from 45.3271,14.4422 -to 44.8666,13.8496
            run zagreb-split-etc -from 45.8150,15.9819 -to 43.5081,16.4402 -etc
          elif [ "${{ matrix.name }}" = fr ]; then
            run dijon-macon -from 47.3220,5.0415 -to 46.3069,4.8287
            run auxerre-beaune-2axles -from 47.7982,3.5673 -to 47.0260,4.8400 -axles 2 -mass-kg 18000
          elif [ "${{ matrix.name }}" = fr-south ]; then
            run aix-nice -from 43.5297,5.4474 -to 43.7102,7.2620
            run aix-nice-2axles -from 43.5297,5.4474 -to 43.7102,7.2620 -axles 2 -mass-kg 18000
            run montpellier-narbonne -from 43.6108,3.8767 -to 43.1843,3.0039
            run aix-gap-la-saulce -from 43.5297,5.4474 -to 44.4170,6.0240
          elif [ "${{ matrix.name }}" = fr-north ]; then
            run lille-arras -from 50.6292,3.0573 -to 50.2910,2.7775
            run lille-amiens -from 50.6292,3.0573 -to 49.8941,2.2958
          elif [ "${{ matrix.name }}" = fr-alps ]; then
            run annemasse-bellegarde -from 46.1939,6.2342 -to 46.1080,5.8260
            run le-fayet-annemasse -from 45.9150,6.7000 -to 46.1939,6.2342
          elif [ "${{ matrix.name }}" = fr-sw ]; then
            run langon-pau -from 44.5530,-0.2490 -to 43.2951,-0.3708
            run millau-viaduct -from 44.2000,3.0300 -to 43.9500,3.1000
            run a63-salles-st-geours -from 44.5500,-0.8700 -to 43.7000,-1.2400
            run a63-salles-st-geours-euro3 -from 44.5500,-0.8700 -to 43.7000,-1.2400 -euro 3
          elif [ "${{ matrix.name }}" = fr-normandy ]; then
            run rouen-caen -from 49.4431,1.0993 -to 49.1829,-0.3707
          elif [ "${{ matrix.name }}" = fr-west ]; then
            run nantes-angers -from 47.2184,-1.5536 -to 47.4784,-0.5632
          elif [ "${{ matrix.name }}" = rs ]; then
            run beograd-nis -from 44.7866,20.4489 -to 43.3209,21.8958
            run batrovci-dimitrovgrad -from 45.0470,19.1010 -to 43.0156,22.7782
            run subotica-beograd-3axles -from 46.1003,19.6656 -to 44.7866,20.4489 -axles 3 -mass-kg 26000
          elif [ "${{ matrix.name }}" = bg ]; then
            run sofia-plovdiv -from 42.6977,23.3219 -to 42.1354,24.7453
            run sofia-plovdiv-co2class4 -from 42.6977,23.3219 -to 42.1354,24.7453 -co2-class 4
            run sofia-plovdiv-zev -from 42.6977,23.3219 -to 42.1354,24.7453 -co2-class 5
          else
            run antwerp-liege -from BEANR -to BELGG
            run brussels-ghent -from 50.8467,4.3525 -to BEGNE -json
            run antwerp-namur-zev -from BEANR -to 50.4669,4.8675 -co2-class 5
          fi
      - name: Map route vs country_km
        run: |
          export SOOTCASE_URL=http://localhost:8080
          case "${{ matrix.name }}" in
            dk-de) trip="-from DKCPH -to DEHAM -tare-kg 15000" ;;
            at) trip="-from ATSZG -to 46.6100,13.8500" ;;
            ch) trip="-from 47.0450,9.4400 -to 47.2150,9.5650" ;;
            cz) trip="-from 50.0755,14.4378 -to 49.1951,16.6068" ;;
            sk) trip="-from 48.1486,17.1077 -to 49.2231,18.7394" ;;
            si) trip="-from 46.6770,15.6470 -to 45.5480,13.7650" ;;
            bg) trip="-from 42.6977,23.3219 -to 42.1354,24.7453" ;;
            hu) trip="-from 47.4979,19.0402 -to 47.6875,17.6504" ;;
            ro) trip="-from 44.4268,26.1025 -to 45.6427,25.5887" ;;
            hr) trip="-from 45.8150,15.9819 -to 43.5081,16.4402" ;;
            rs) trip="-from 44.7866,20.4489 -to 43.3209,21.8958" ;;
            fr) trip="-from 47.3220,5.0415 -to 46.3069,4.8287" ;;
            fr-south) trip="-from 43.5297,5.4474 -to 43.7102,7.2620" ;;
            fr-west) trip="-from 47.2184,-1.5536 -to 47.4784,-0.5632" ;;
            fr-north) trip="-from 50.6292,3.0573 -to 49.8941,2.2958" ;;
            fr-alps) trip="-from 46.1939,6.2342 -to 46.1080,5.8260" ;;
            fr-sw) trip="-from 44.5530,-0.2490 -to 43.2951,-0.3708" ;;
            fr-normandy) trip="-from 49.4431,1.0993 -to 49.1829,-0.3707" ;;
            pl) trip="-from 51.1079,17.0385 -to 50.2945,18.6714" ;;
            *) trip="-from BEANR -to BELGG" ;;
          esac
          ./cc calc -date 2026-11-04 -cargo-kg 20000 -json $trip > trip.json
          cmp=$(jq -r '
            ([.route[] | {k: (if .kind == "road" then .country else .kind end), km}] | group_by(.k) | map({(.[0].k): (map(.km) | add)}) | add) as $map
            | (.country_km + (if .ferry_km then {ferry: .ferry_km} else {} end)) as $want
            | (($map | keys) + ($want | keys) | unique)[]
            | "\(.) map \($map[.] // 0 | . * 10 | round / 10) km, country_km \($want[.] // 0 | . * 10 | round / 10) km"' trip.json)
          runs=$(jq -r '[.route[] | "\(.kind):\(.country // "")"] | join(" > ")' trip.json)
          secs=$(jq -r '[(.lines // [])[] | select(.component == "infrastructure" and .section != null and .rate_unit == "EUR/section")] | "sections: \(length), route km on them \(map(.km) | add // 0 | . * 10 | round / 10)"' trip.json)
          cmp="$cmp
          $secs"
          echo "$runs"; echo "$cmp"
          echo "::notice title=${{ matrix.name }}/map::$runs%0A$(echo "$cmp" | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Save the Slovenian route for inspection
        if: matrix.name == 'si'
        run: |
          mkdir -p dbg && cp trip.json dbg/si-trip.json && cd dbg && git init -q && git checkout -q -b live-out && git add -A
          git -c user.name=live-check -c user.email=live-check@users.noreply.github.com commit -qm "Slovenian route"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" live-out
      - name: Logs
        if: failure()
        working-directory: sootcase-src
        run: docker compose logs --tail 100
