name: Live check
# Runs Sootcase (v0.10.1, else main) with real OSRM routing on a map
# extract, then prices trips with carbon-cost and prints them as
# annotations. Run from the Actions tab, or push to the live-check branch.
on:
  workflow_dispatch:
  push:
    branches: [live-check]
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dk-de
            maps: europe/denmark europe/germany/schleswig-holstein europe/germany/hamburg
          - name: be
            maps: europe/belgium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o cc ./cmd/carbon-cost
      - name: Sootcase
        run: |
          git clone -q --depth 1 --branch v0.10.1 https://github.com/majidkabir/sootcase sootcase-src 2>/dev/null \
            || { rm -rf sootcase-src; git clone -q --depth 1 https://github.com/majidkabir/sootcase sootcase-src; }
          git -C sootcase-src log --oneline -1
      - name: Map
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool >/dev/null
          mkdir -p maps && cd maps
          for r in ${{ matrix.maps }}; do
            curl -fsSL -o "$(basename $r).osm.pbf" "https://download.geofabrik.de/$r-latest.osm.pbf"
          done
          if [ "$(ls *.osm.pbf | wc -l)" -gt 1 ]; then osmium merge -o region.osm.pbf *.osm.pbf; else mv *.osm.pbf region.osm.pbf; fi
          ls -la
      - name: Start stack
        working-directory: sootcase-src
        run: |
          (cd ../maps && python3 -m http.server 8000 >/dev/null 2>&1 &)
          ip=$(hostname -I | awk '{print $1}')
          export OSRM_PBF_URL="http://$ip:8000/region.osm.pbf" SEA_RESOLUTION_KM=100
          export SOOTCASE_FACTORS="desnz-2026,nl-iww-2026,eu-mrv-2024,glec-3.3"
          docker compose up -d --build
          for i in $(seq 1 240); do
            if curl -fs localhost:8080/healthz >/dev/null; then echo healthy after $((i*5))s; exit 0; fi
            sleep 5
          done
          docker compose logs --tail 50; exit 1
      - name: Trips
        run: |
          set +e
          export SOOTCASE_URL=http://localhost:8080
          run() {
            name="${{ matrix.name }}/$1"; shift
            out=$(./cc calc -date 2026-11-04 -cargo-kg 20000 -eua 75 "$@" 2>&1); code=$?
            echo "== $name (exit $code)"; echo "$out"
            echo "::notice title=$name::exit $code%0A$(echo "$out" | grep -v 'counted as on tolled roads' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          }
          if [ "${{ matrix.name }}" = dk-de ]; then
            run cph-ham -from DKCPH -to DEHAM -compare 1,4,5 -trips-per-year 200
            run cph-ham-mrv -from DKCPH -to DEHAM -tare-kg 15000
            run aarhus-hamburg -from DKAAR -to DEHAM
          else
            run antwerp-liege -from BEANR -to BELGG
            run brussels-ghent -from 50.8467,4.3525 -to BEGNE -json
            run antwerp-namur-zev -from BEANR -to 50.4669,4.8675 -co2-class 5
          fi
      - name: Logs
        if: failure()
        working-directory: sootcase-src
        run: docker compose logs --tail 100
