name: Publish data
# After a data workflow succeeds, publishes to tariffs/data (on main) its
# datasets that differ only in what OpenStreetMap gives: positions, booth
# names and headings, and the extract's date (tools/orct/publish.py), its
# ferry crossings files that differ only in the terminals' positions, and
# its exchange rate files (fx/data) that only add days after the last.
# A dataset with any other change, or a new one, is listed in the run's
# summary for review and not published. Run it by hand to go over all four
# workflows' last output.
on:
  workflow_run:
    workflows: [Tables data, History data, Croatia data, France data]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-data
  cancel-in-progress: false
jobs:
  publish:
    # A run with a failed builder still pushed the others' datasets.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Publish
        env:
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          case "$WORKFLOW" in
            "Tables data") branches=tables-out;;
            "History data") branches=history-out;;
            "Croatia data") branches=hr-out;;
            "France data") branches=fr-out;;
            *) branches="tables-out history-out hr-out fr-out";;
          esac
          publish() {
            : > report.txt
            for b in $branches; do
              rm -rf new && mkdir new
              git fetch -q --depth 1 origin "$b" && git archive FETCH_HEAD orct | tar -x -C new
              python3 tools/orct/publish.py new/orct tariffs/data | tee -a report.txt
              if git cat-file -e FETCH_HEAD:ferries 2>/dev/null; then
                git archive FETCH_HEAD ferries | tar -x -C new
                python3 tools/orct/publish.py --crossings new/ferries ferries/data | tee -a report.txt
              fi
              # The exchange rates (History data): only new days.
              if git cat-file -e FETCH_HEAD:fx 2>/dev/null; then
                git archive FETCH_HEAD fx | tar -x -C new
                python3 tools/orct/publish.py --fx new/fx fx/data | tee -a report.txt
              fi
            done
          }
          # Main may move meanwhile: start again from it if the push fails.
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD
            publish
            git add tariffs/data ferries/data fx/data
            if git diff --cached --quiet; then echo "nothing to publish"; break; fi
            # The tool's tests read tariffs/data; a push from here doesn't run CI.
            go test ./... >/dev/null
            n=$(grep -c '^published' report.txt)
            git -c user.name=actions -c user.email=actions@github.com commit -qm "Data: $n files with OpenStreetMap's newer positions or new days' exchange rates (${WORKFLOW:-all data workflows})" -m "${RUN_URL:-Run by hand.} Only positions, booth names and headings, the extract date, or exchange rates for days after the last changed (tools/orct/publish.py)."
            git push -q origin HEAD:main && break
            [ $i = 3 ] && exit 1; sleep 10
          done
          f=$(for b in $branches; do git fetch -q --depth 1 origin "$b" && git show FETCH_HEAD:build-errors.txt 2>/dev/null | sed "s|^|- $b: |"; done || true)
          printf '## Builders that failed\n%s\n' "${f:-none}" >> "$GITHUB_STEP_SUMMARY"
          p=$(grep '^published' report.txt | sed 's/^published /- /' || true)
          w=$(grep '^::warning' report.txt | sed 's/^::warning title=\([^:]*\)::/- \1: /' || true)
          printf '## Published (OpenStreetMap only, or new days of exchange rates)\n%s\n## For review (not published)\n%s\n' "${p:-nothing}" "${w:-nothing}" >> "$GITHUB_STEP_SUMMARY"
