name: Release
# Run it from the Actions tab (Run workflow, version e.g. v0.1.0), or push
# a tag like v0.1.0. It builds binaries for Linux, macOS and Windows,
# attaches them to a GitHub release (creating the tag if needed), and
# publishes the Docker image ghcr.io/majidkabir/carbon-cost.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
env:
  VERSION: ${{ inputs.version || github.ref_name }}
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/carbon-cost_${VERSION}_${os}_${arch}${ext}" ./cmd/carbon-cost
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in v[0-9]*) ;; *) echo "version must look like v0.1.0"; exit 1;; esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/majidkabir/carbon-cost:${{ env.VERSION }}
            ghcr.io/majidkabir/carbon-cost:latest
