name: Roads data
# Builds roads/data from Geofabrik OpenStreetMap extracts and pushes it
# to the roads-out branch. Push to the roads-data branch to run it.
on:
  push:
    branches: [roads-data]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: for i in 1 2 3 4 5; do { sudo apt-get update -qq || true; } && sudo apt-get install -y -qq osmium-tool poppler-utils && break; [ $i = 5 ] && exit 1; sleep 30; done && pip install -q shapely osmium
      - name: Build
        run: |
          mkdir -p out
          # tools/roads/ONLY lists the countries to rebuild; the others are
          # kept from the roads-out branch.
          list="CZ:czech-republic PL:poland BG:bulgaria SK:slovakia HU:hungary RO:romania IT:italy DE:germany AT:austria BY:belarus"
          if [ -f tools/roads/ONLY ]; then
            git fetch -q origin roads-out && git archive FETCH_HEAD | tar -x -C out
            rm -f out/bg-list.html out/bg-network.json
            list=$(cat tools/roads/ONLY)
          fi
          for x in $list; do
            cc=${x%%:*}; name=${x#*:}
            curl -fsSL --retry 10 --retry-delay 60 --retry-all-errors -o in.pbf "https://download.geofabrik.de/europe/$name/$name-latest.osm.pbf"
            export OSM_EXTRACT=$(osmium fileinfo -g header.option.osmosis_replication_timestamp in.pbf)
            if [ $cc = PL ]; then
              # The tolled sections from the law (the parsed list in the
              # repository must be the law's), then every way with a ref,
              # the streets the list names, junctions, places and
              # administrative boundaries to find them by.
              curl -fsSL --retry 5 --retry-delay 20 -o law.pdf https://eli.gov.pl/api/acts/DU/2026/33/text/O/D20260033.pdf
              pdftotext -layout law.pdf law.txt
              python3 tools/roads/pl_network.py law.txt | diff -u tools/roads/pl-network.json -
              streets=$(python3 -c "import json; print(','.join(sorted({(p.get('street') or p.get('junction')).replace('ul. ', '') for s in json.load(open('tools/roads/pl-network.json'))['sections'] for p in (s['from'], s['to']) if p.get('street') or p.get('junction')})))")
              osmium tags-filter -O -o roads.pbf in.pbf w/ref w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link "w/name=$streets" n/highway=motorway_junction n/place r/boundary=administrative
            elif [ $cc = CZ ]; then
              # The tolled class I roads and each road's km from the law (the
              # parsed list in the repository must be the law's); where they
              # are tolled, from the toll map's capture (tools/roads/cz_myto.py).
              curl -fsSL --retry 5 --retry-delay 20 -o law.pdf https://www.epravo.cz/_dataPublic/sbirky/2025/Sb_2025_527_PZZ.pdf
              pdftotext -layout law.pdf law.txt
              python3 tools/roads/cz_network.py law.txt | diff -u tools/roads/cz-network.json -
              osmium tags-filter -O -o roads.pbf in.pbf w/highway=motorway,trunk,primary,secondary
            elif [ $cc = BG ]; then
              # The tolled roads from the law of 2025 and the toll segments
              # of the list of 2022 (the parsed lists in the repository must
              # be the laws'), then the main roads they're on.
              curl -fsSL --retry 5 --retry-delay 20 -o list.html "https://dv.parliament.bg/DVWeb/showMaterialDV.jsp?idMat=234264"
              curl -fsSL --retry 5 --retry-delay 20 -o law.pdf https://dv.parliament.bg/DVPics/2022/78_22/6119.pdf
              pdftotext -layout law.pdf law.txt
              python3 tools/roads/bg_network.py list.html law.txt > bg-law.json
              if [ -s tools/roads/bg-network.json ]; then
                diff -u tools/roads/bg-network.json bg-law.json
              else
                echo "::warning::tools/roads/bg-network.json is empty: the parsed laws are on roads-out"; cp bg-law.json tools/roads/bg-network.json; cp bg-law.json out/bg-network.json
              fi
              rm -f list.html bg-law.json
              osmium tags-filter -O -o roads.pbf in.pbf w/highway=motorway,trunk,primary,secondary
            else
              osmium tags-filter -O -o roads.pbf in.pbf w/highway=motorway,trunk,primary r/ref:HU:edid
            fi
            extra=""
            if [ $cc = RO ]; then
              osmium tags-filter -O -o areas.pbf in.pbf a/landuse=residential,commercial,industrial,retail r/boundary=administrative
              extra=areas.pbf
            fi
            if [ $cc = HU ]; then
              # Budapest's boundary (its roads aren't in annex 1).
              osmium tags-filter -O -o areas.pbf in.pbf r/boundary=administrative
              extra=areas.pbf
            fi
            if [ $cc = CZ ]; then
              # A stop (too much changed since the toll map's reading, or a
              # class off the law's) keeps the last CZ data and pushes the
              # new samples for the next reading; the run fails at the end.
              if ! ROADS_DEBUG=$(cat tools/roads/DEBUG 2>/dev/null) python3 tools/roads/build.py CZ roads.pbf out/cz.json.gz $extra; then
                touch cz-stopped
                [ -f out/cz.json.gz ] || { git fetch -q origin roads-out && git show FETCH_HEAD:cz.json.gz > out/cz.json.gz; }
              fi
            else
              ROADS_DEBUG=$(cat tools/roads/DEBUG 2>/dev/null) python3 tools/roads/build.py $cc roads.pbf out/$(echo $cc | tr A-Z a-z).json.gz $extra
            fi
            rm -f in.pbf roads.pbf areas.pbf law.pdf law.txt
          done
          ls -la out
      - name: Push
        run: |
          cd out
          git init -q -b roads-out && git add -A
          git -c user.name=actions -c user.email=actions@github.com commit -qm "roads data from OpenStreetMap"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" roads-out
      - name: CZ stopped
        run: |
          if [ -f cz-stopped ]; then
            echo "::error::CZ stopped (see Build): its data on roads-out is the last one; take a new reading with the samples there (tools/roads/cz_myto.py)"
            exit 1
          fi
