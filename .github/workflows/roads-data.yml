name: Roads data
# Builds roads/data from Geofabrik OpenStreetMap extracts and pushes it
# to the roads-out branch. Push to the roads-data branch to run it.
on:
  push:
    branches: [roads-data]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && break; [ $i = 5 ] && exit 1; sleep 30; done && pip install -q shapely osmium
      - name: Build
        run: |
          mkdir -p out
          # tools/roads/ONLY lists the countries to rebuild; the others are
          # kept from the roads-out branch.
          list="CZ:czech-republic PL:poland BG:bulgaria SK:slovakia HU:hungary RO:romania"
          if [ -f tools/roads/ONLY ]; then
            git fetch -q origin roads-out && git archive FETCH_HEAD | tar -x -C out
            list=$(cat tools/roads/ONLY)
          fi
          for x in $list; do
            cc=${x%%:*}; name=${x#*:}
            curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o in.pbf "https://download.geofabrik.de/europe/$name-latest.osm.pbf"
            export OSM_EXTRACT=$(osmium fileinfo -g header.option.osmosis_replication_timestamp in.pbf)
            osmium tags-filter -O -o roads.pbf in.pbf w/highway=motorway,trunk,primary r/ref:HU:edid
            extra=""
            if [ $cc = RO ]; then
              osmium tags-filter -O -o areas.pbf in.pbf a/landuse=residential,commercial,industrial,retail r/boundary=administrative
              extra=areas.pbf
            fi
            python3 tools/roads/build.py $cc roads.pbf out/$(echo $cc | tr A-Z a-z).json.gz $extra
            rm -f in.pbf roads.pbf areas.pbf
          done
          ls -la out
      - name: Push
        run: |
          cd out
          git init -q -b roads-out && git add -A
          git -c user.name=actions -c user.email=actions@github.com commit -qm "roads data from OpenStreetMap"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" roads-out
