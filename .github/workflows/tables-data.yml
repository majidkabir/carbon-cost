name: Tables data
# Fetches the official pages behind the Romanian, Danish bridge and
# Hungarian rate tables, the Fréjus and Mont Blanc tunnels and the Baltic,
# Swedish, Luxembourg and UK road user charges, and the
# Norwegian, Irish, Swedish bridge, North Macedonian, Montenegrin and Greek toll stations and the Turkish bridges (tools/tables/sources.json), rebuilds the tables
# from them, compares them with the committed ones, and pushes the pages,
# their manifest and the rebuilt tables to the tables-out branch. Push to
# the tables-data branch to run it.
on:
  push:
    branches: [tables-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils osmium-tool && break; [ $i = 5 ] && exit 1; sleep 30; done
      - name: Fetch
        run: |
          python3 -u tools/tables/fetch.py tools/tables/sources.json out
          for f in out/*.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" || echo "not a PDF: $f"; done
          for f in out/tr-*.pdf out/es-*.pdf; do pdftotext -bbox "$f" "${f%.pdf}.bbox.html" || echo "not a PDF: $f"; done
          # A source that fails this run keeps the copy the last run fetched.
          git fetch -q --depth 1 origin tables-out && mkdir -p prev && git archive FETCH_HEAD | tar -x -C prev
          python3 tools/history/reuse.py tools/tables/sources.json out prev && rm -rf prev
      - name: Irish toll booths (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o ie.pbf https://download.geofabrik.de/europe/ireland-and-northern-ireland-latest.osm.pbf || { keep ie-osm.geojsonseq ie-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp ie.pbf > out/ie-osm-timestamp.txt
          osmium tags-filter -O -o ie-b.pbf ie.pbf n/barrier=toll_booth n/highway=toll_gantry w/barrier=toll_booth w/highway=motorway,trunk,primary,motorway_link,trunk_link
          osmium export -O -f geojsonseq -o out/ie-osm.geojsonseq ie-b.pbf
      - name: Swedish charged bridges (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o se.pbf https://download.geofabrik.de/europe/sweden-latest.osm.pbf || { keep se-osm.geojsonseq se-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp se.pbf > out/se-osm-timestamp.txt
          osmium tags-filter -O -o se-b.pbf se.pbf w/name=Sundsvallsbron,Motalabron,Skurubron,"Nya Skurubron" n/highway=toll_gantry n/barrier=toll_booth
          osmium export -O -f geojsonseq -o out/se-osm.geojsonseq se-b.pbf
      - name: North Macedonian toll stations (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o mk.pbf https://download.geofabrik.de/europe/macedonia-latest.osm.pbf || { keep mk-osm.geojsonseq mk-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp mk.pbf > out/mk-osm-timestamp.txt
          osmium tags-filter -O -o mk-b.pbf mk.pbf n/barrier=toll_booth w/barrier=toll_booth w/highway=motorway,trunk,primary,motorway_link,trunk_link
          osmium export -O -f geojsonseq -o out/mk-osm.geojsonseq mk-b.pbf
      - name: Montenegrin toll stations (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o me.pbf https://download.geofabrik.de/europe/montenegro-latest.osm.pbf || { keep me-osm.geojsonseq me-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp me.pbf > out/me-osm-timestamp.txt
          osmium tags-filter -O -o me-b.pbf me.pbf n/barrier=toll_booth w/barrier=toll_booth n/highway=motorway_junction w/name=Sozina "w/name=Tunel Sozina"
          osmium export -O -f geojsonseq -o out/me-osm.geojsonseq me-b.pbf
      - name: Greek toll stations (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o gr.pbf https://download.geofabrik.de/europe/greece-latest.osm.pbf || { keep gr-osm.geojsonseq gr-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp gr.pbf > out/gr-osm-timestamp.txt
          osmium tags-filter -O -o gr-b.pbf gr.pbf n/barrier=toll_booth w/barrier=toll_booth w/highway=motorway,trunk,motorway_link,trunk_link
          osmium export -O -f geojsonseq -o out/gr-osm.geojsonseq gr-b.pbf
      - name: Turkish bridges and toll booths (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o tr.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf || { keep tr-osm.geojsonseq tr-osm-booths.geojsonseq tr-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp tr.pbf > out/tr-osm-timestamp.txt
          osmium tags-filter -O -o tr-b.pbf tr.pbf "w/name=15 Temmuz Şehitler Köprüsü,Fatih Sultan Mehmet Köprüsü,Osmangazi Köprüsü,Yavuz Sultan Selim Köprüsü,1915 Çanakkale Köprüsü" "w/bridge:name=15 Temmuz Şehitler Köprüsü,Fatih Sultan Mehmet Köprüsü,Osmangazi Köprüsü,Yavuz Sultan Selim Köprüsü,1915 Çanakkale Köprüsü"
          osmium export -O -f geojsonseq -o out/tr-osm.geojsonseq tr-b.pbf
          osmium tags-filter -O -o tr-t.pbf tr.pbf n/barrier=toll_booth w/barrier=toll_booth n/highway=toll_gantry n/highway=motorway_junction
          osmium export -O -f geojsonseq -o out/tr-osm-booths.geojsonseq tr-t.pbf
      - name: Spanish SEITT toll stations (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          for r in madrid castilla-la-mancha murcia andalucia; do
            curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o es-$r.pbf https://download.geofabrik.de/europe/spain/$r-latest.osm.pbf || { keep es-osm.geojsonseq es-osm-timestamp.txt; exit 0; }
            osmium tags-filter -O -o es-$r-b.pbf es-$r.pbf n/barrier=toll_booth w/barrier=toll_booth n/highway=motorway_junction,toll_gantry w/highway=motorway_link,motorway
          done
          osmium fileinfo -g header.option.osmosis_replication_timestamp es-madrid.pbf > out/es-osm-timestamp.txt
          osmium merge -O -o es-b.pbf es-*-b.pbf
          osmium export -O -f geojsonseq -o out/es-osm.geojsonseq es-b.pbf
      - name: Portuguese motorways (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o pt.pbf https://download.geofabrik.de/europe/portugal-latest.osm.pbf || { keep pt-osm.geojsonseq pt-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp pt.pbf > out/pt-osm-timestamp.txt
          osmium tags-filter -O -o pt-m.pbf pt.pbf w/highway=motorway,motorway_link n/highway=motorway_junction,toll_gantry n/barrier=toll_booth w/barrier=toll_booth
          osmium export -O -f geojsonseq -a type,id -o out/pt-osm.geojsonseq pt-m.pbf
      - name: Build
        run: |
          python3 tools/tables/ro.py out out/tables
          python3 tools/tables/dk_bridges.py out out/tables
          python3 tools/tables/hu.py out out/tables
          python3 tools/tables/frejus.py out out/tables
          python3 tools/tables/mont_blanc.py out out/tables
          python3 tools/tables/lv.py out out/tables
          python3 tools/tables/ee.py out out/tables
          python3 tools/tables/se.py out out/tables
          python3 tools/tables/lu.py out out/tables
          python3 tools/tables/gb.py out out/tables
          python3 tools/tables/no.py out out/tables
          python3 tools/tables/ie.py out out/tables
          python3 tools/tables/se_bridges.py out out/tables
          python3 tools/tables/se_congestion.py out out/tables
          python3 tools/tables/mk.py tools/tables/transcribed/mk-2025.json out out/tables
          python3 tools/tables/me.py out out/tables
          python3 tools/tables/gr.py out out/tables
          python3 tools/tables/lt.py tools/tables/browser/lt-447.txt out/tables
          python3 tools/tables/tr.py out out/tables
          python3 tools/tables/pt.py out out/tables
          python3 tools/tables/es_seitt.py out out/tables
          python3 tools/tables/fuel_co2.py out out/tables
          python3 tools/tables/tunnels.py tools/tables/transcribed out out/tables
          python3 tools/tables/es_ausol.py out out/tables
          python3 tools/tables/gb_london.py out out/tables
          python3 tools/tables/ro_bridges.py out out/tables
          python3 tools/tables/es_castellana.py out out/tables
          python3 tools/tables/es_aulesa.py out out/tables
          python3 tools/tables/it.py out out/tables
          python3 tools/tables/es_ministry.py out out/tables
          python3 tools/tables/m6toll.py out out/tables
          python3 tools/tables/ba.py out out/tables
          python3 tools/tables/al.py out out/tables
          python3 tools/tables/ba_rs.py tools/tables/transcribed out out/tables
          python3 tools/tables/md.py out out/tables
          python3 tools/tables/es_regional.py out out/tables
          python3 tools/tables/es_basque.py out out/tables
          python3 tools/tables/es_ap53.py out out/tables
          python3 tools/tables/es_radials.py out out/tables
          python3 tools/tables/es_basque_ap8.py out out/tables
      - name: Compare with the committed tables
        run: |
          cd out/tables
          for f in *.json; do
            if [ "$f" = hu-annex1.json ]; then c=../../tools/roads/hu-annex1.json; else c=../../rates/data/$f; fi
            if [ ! -f "$c" ]; then echo "::warning title=$f::new table (no committed $c)"
            elif cmp -s "$f" "$c"; then echo "$f: same as committed"
            else echo "::warning title=$f::differs from the committed $c"; diff <(python3 -m json.tool "$c") <(python3 -m json.tool "$f") | head -40; fi
          done | tee compare.txt
          python3 ../../tools/tables/check_transcribed.py .. ../../tools/fr/transcribed | tee -a compare.txt
          python3 ../../tools/tables/check_transcribed.py .. ../../tools/tables/transcribed | tee -a compare.txt
      - name: Push
        if: always()
        run: |
          cd out
          git init -q -b tables-out && git add -A
          git -c user.name=actions -c user.email=actions@github.com commit -qm "Rate table sources"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tables-out
