name: Tables data
# Fetches the official pages behind the Romanian, Danish bridge and
# Hungarian rate tables, the Fréjus and Mont Blanc tunnels and the Baltic,
# Swedish, Luxembourg and UK road user charges, and the
# Norwegian, Irish, Swedish bridge, North Macedonian, Montenegrin and Greek toll stations and the Turkish bridges (tools/tables/sources.json), rebuilds the tables
# from them, converts them to ORCT datasets (tools/orct/convert.py),
# compares those with the committed ones (tariffs/data), and pushes the
# pages, their manifest, the tables and the datasets to the tables-out
# branch. Push to the tables-data branch to run it.
on:
  push:
    branches: [tables-data]
  # Daily (01:23 UTC); Publish data then publishes what changed only in
  # OpenStreetMap's positions.
  schedule:
    - cron: "23 1 * * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - run: for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils osmium-tool && break; [ $i = 5 ] && exit 1; sleep 30; done
      - name: Fetch
        run: |
          python3 -u tools/tables/fetch.py tools/tables/sources.json out
          for f in out/*.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" || echo "not a PDF: $f"; done
          for f in out/tr-*.pdf out/es-*.pdf; do pdftotext -bbox "$f" "${f%.pdf}.bbox.html" || echo "not a PDF: $f"; done
          # A source that fails this run keeps the copy the last run fetched.
          git fetch -q --depth 1 origin tables-out && mkdir -p prev && git archive FETCH_HEAD | tar -x -C prev
          python3 tools/history/reuse.py tools/tables/sources.json out prev && rm -rf prev
      - name: Wait for Geofabrik
        # Geofabrik refuses connections from a runner for a while at busy
        # times (curl 7 at once); the extract steps below keep the last
        # run's copy when it does. Wait up to 15 minutes for it first.
        run: |
          for i in $(seq 1 15); do
            curl -fsI --max-time 30 https://download.geofabrik.de/europe/montenegro/montenegro-latest.osm.pbf > /dev/null && { echo "Geofabrik answers (try $i)"; exit 0; }
            echo "Geofabrik refuses (try $i); waiting a minute"; sleep 60
          done
          echo "::warning::Geofabrik still refuses after 15 minutes"
      - name: Irish toll booths (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o ie.pbf https://download.geofabrik.de/europe/ireland-and-northern-ireland/ireland-and-northern-ireland-latest.osm.pbf || { keep ie-osm.geojsonseq ie-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp ie.pbf > out/ie-osm-timestamp.txt
          osmium tags-filter -O -o ie-b.pbf ie.pbf n/barrier=toll_booth n/highway=toll_gantry w/barrier=toll_booth w/highway=motorway,trunk,primary,motorway_link,trunk_link
          osmium export -O -f geojsonseq -o out/ie-osm.geojsonseq ie-b.pbf
      - name: Swedish charged bridges (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o se.pbf https://download.geofabrik.de/europe/sweden/sweden-latest.osm.pbf || { keep se-osm.geojsonseq se-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp se.pbf > out/se-osm-timestamp.txt
          osmium tags-filter -O -o se-b.pbf se.pbf w/name=Sundsvallsbron,Motalabron,Skurubron,"Nya Skurubron" n/highway=toll_gantry n/barrier=toll_booth
          osmium export -O -f geojsonseq -o out/se-osm.geojsonseq se-b.pbf
      - name: North Macedonian toll stations (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o mk.pbf https://download.geofabrik.de/europe/macedonia/macedonia-latest.osm.pbf || { keep mk-osm.geojsonseq mk-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp mk.pbf > out/mk-osm-timestamp.txt
          osmium tags-filter -O -o mk-b.pbf mk.pbf n/barrier=toll_booth w/barrier=toll_booth w/highway=motorway,trunk,primary,motorway_link,trunk_link
          osmium export -O -f geojsonseq -o out/mk-osm.geojsonseq mk-b.pbf
      - name: Montenegrin toll stations (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o me.pbf https://download.geofabrik.de/europe/montenegro/montenegro-latest.osm.pbf || { keep me-osm.geojsonseq me-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp me.pbf > out/me-osm-timestamp.txt
          osmium tags-filter -O -o me-b.pbf me.pbf n/barrier=toll_booth w/barrier=toll_booth n/highway=motorway_junction w/name=Sozina "w/name=Tunel Sozina"
          osmium export -O -f geojsonseq -o out/me-osm.geojsonseq me-b.pbf
      - name: Greek toll stations (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o gr.pbf https://download.geofabrik.de/europe/greece/greece-latest.osm.pbf || { keep gr-osm.geojsonseq gr-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp gr.pbf > out/gr-osm-timestamp.txt
          osmium tags-filter -O -o gr-b.pbf gr.pbf n/barrier=toll_booth w/barrier=toll_booth w/highway=motorway,trunk,motorway_link,trunk_link
          osmium export -O -f geojsonseq -o out/gr-osm.geojsonseq gr-b.pbf
      - name: Turkish bridges and toll booths (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o tr.pbf https://download.geofabrik.de/europe/turkey/turkey-latest.osm.pbf || { keep tr-osm.geojsonseq tr-osm-booths.geojsonseq tr-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp tr.pbf > out/tr-osm-timestamp.txt
          osmium tags-filter -O -o tr-b.pbf tr.pbf "w/name=15 Temmuz Şehitler Köprüsü,Fatih Sultan Mehmet Köprüsü,Osmangazi Köprüsü,Yavuz Sultan Selim Köprüsü,1915 Çanakkale Köprüsü" "w/bridge:name=15 Temmuz Şehitler Köprüsü,Fatih Sultan Mehmet Köprüsü,Osmangazi Köprüsü,Yavuz Sultan Selim Köprüsü,1915 Çanakkale Köprüsü"
          osmium export -O -f geojsonseq -o out/tr-osm.geojsonseq tr-b.pbf
          osmium tags-filter -O -o tr-t.pbf tr.pbf n/barrier=toll_booth w/barrier=toll_booth n/highway=toll_gantry n/highway=motorway_junction
          osmium export -O -f geojsonseq -o out/tr-osm-booths.geojsonseq tr-t.pbf
      - name: Spanish SEITT toll stations (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          for r in madrid castilla-la-mancha murcia andalucia; do
            timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o es-$r.pbf https://download.geofabrik.de/europe/spain/$r/$r-latest.osm.pbf || { keep es-osm.geojsonseq es-osm-timestamp.txt; exit 0; }
            osmium tags-filter -O -o es-$r-b.pbf es-$r.pbf n/barrier=toll_booth w/barrier=toll_booth n/highway=motorway_junction,toll_gantry w/highway=motorway_link,motorway
          done
          osmium fileinfo -g header.option.osmosis_replication_timestamp es-madrid.pbf > out/es-osm-timestamp.txt
          osmium merge -O -o es-b.pbf es-*-b.pbf
          osmium export -O -f geojsonseq -o out/es-osm.geojsonseq es-b.pbf
      - name: Portuguese motorways (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o pt.pbf https://download.geofabrik.de/europe/portugal/portugal-latest.osm.pbf || { keep pt-osm.geojsonseq pt-osm-timestamp.txt; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp pt.pbf > out/pt-osm-timestamp.txt
          osmium tags-filter -O -o pt-m.pbf pt.pbf w/highway=motorway,motorway_link n/highway=motorway_junction,toll_gantry n/barrier=toll_booth w/barrier=toll_booth
          osmium export -O -f geojsonseq -a type,id -o out/pt-osm.geojsonseq pt-m.pbf
      - name: Serbian toll booths and the Belgrade bypass (OpenStreetMap)
        run: |
          keep() { git fetch -q --depth 1 origin tables-out && for f in "$@"; do git show FETCH_HEAD:$f > out/$f; done; echo "::warning::Geofabrik unreachable: keeping the last run's $*"; }
          timeout 1200 curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -o rs.pbf https://download.geofabrik.de/europe/serbia/serbia-latest.osm.pbf || { keep rs-osm.geojsonseq rs-osm-timestamp.txt rs-bypass-osm.geojsonseq; exit 0; }
          osmium fileinfo -g header.option.osmosis_replication_timestamp rs.pbf > out/rs-osm-timestamp.txt
          osmium tags-filter -O -o rs-b.pbf rs.pbf n/barrier=toll_booth
          osmium export -O -f geojsonseq -o out/rs-osm.geojsonseq rs-b.pbf
          # The Belgrade bypass: motorways and junctions by Belgrade (rs_bypass.py).
          osmium extract -O -b 20.2,44.65,20.6,44.95 rs.pbf -o rs-bg.pbf
          osmium tags-filter -O -o rs-bg-m.pbf rs-bg.pbf w/highway=motorway n/highway=motorway_junction
          osmium export -O -f geojsonseq -a type,id -o out/rs-bypass-osm.geojsonseq rs-bg-m.pbf
      - name: OCR tools, and the Serbian toll decision's tables
        # Tesseract reads tables published only as scans or images: CalMac's
        # fares (gb_calmac.py, in Build) and the putarina decision's
        # amendment in force (tools/rs/gazette_ocr.py, here; tools/tables/rs.py),
        # whose last run's reading is kept while the issue's content is the same.
        run: |
          for i in 1 2 3; do sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-srp >/dev/null && break; sleep 30; done
          pip install -q opencv-python-headless pytesseract pymupdf
          ls out/rs-sg-*.pdf >/dev/null 2>&1 || exit 0
          git fetch -q --depth 1 origin tables-out
          for f in out/rs-sg-*.pdf; do
            b=$(basename "$f" .pdf)
            d=$(python3 tools/rs/gazette_ocr.py --digest "$f")
            if git show "FETCH_HEAD:$b.json" > prev.json 2>/dev/null && grep -q "\"digest\": \"$d\"" prev.json; then mv prev.json "out/$b.json"; continue; fi
            python3 tools/rs/gazette_ocr.py "$f" "out/$b.json" || echo "::error title=gazette_ocr::$f not read"
          done
          rm -f prev.json
      - name: Build
        # A builder that fails (an Overpass answer short of booths, a page that
        # changed) is reported and the others still run; the run fails at the end.
        run: |
          run() { "$@" || { echo "::error title=$2::failed"; echo "$2" >> out/build-errors.txt; }; }
          run python3 tools/tables/ro.py out out/tables
          run python3 tools/tables/dk_bridges.py out out/tables
          run python3 tools/tables/hu.py out out/tables
          run python3 tools/tables/frejus.py out out/tables
          run python3 tools/tables/mont_blanc.py out out/tables
          run python3 tools/tables/lv.py out out/tables
          run python3 tools/tables/ee.py out out/tables
          run python3 tools/tables/ee_ferries.py out out/tables
          run python3 tools/tables/se.py out out/tables
          run python3 tools/tables/lu.py out out/tables
          run python3 tools/tables/gb.py out out/tables
          run python3 tools/tables/no.py out out/tables
          run python3 tools/tables/no_ferries.py out out/tables
          run python3 tools/tables/gb_calmac.py out out/tables
          run python3 tools/tables/hr_jadrolinija.py out out/tables
          run python3 tools/tables/it_messina.py out out/tables
          run python3 tools/tables/dk_bornholm.py out out/tables
          run python3 tools/tables/dk_ferries.py out out/tables
          run python3 tools/tables/scandlines.py out out/tables
          run python3 tools/tables/polsca.py out out/tables
          run python3 tools/tables/de_elbfaehre.py out out/tables
          run python3 tools/tables/ets_islands.py out out/ferries
          run python3 tools/tables/ferry_ships.py out out/ferries
          run python3 tools/tables/ferry_ets.py out out/ferries
          run python3 tools/tables/ie.py out out/tables
          run python3 tools/tables/se_bridges.py out out/tables
          run python3 tools/tables/se_congestion.py out out/tables
          run python3 tools/tables/mk.py tools/tables/transcribed/mk-2025.json out out/tables
          run python3 tools/tables/me.py out out/tables
          run python3 tools/tables/gr.py out out/tables
          run python3 tools/tables/lt.py tools/tables/browser/lt-447.txt out/tables
          run python3 tools/tables/tr.py out out/tables
          run python3 tools/tables/pt.py out out/tables
          run python3 tools/tables/es_seitt.py out out/tables
          run python3 tools/tables/fuel_co2.py out out/tables
          run python3 tools/tables/is_km.py out out/tables
          run python3 tools/tables/by.py out out/tables
          run python3 tools/tables/pl_a4.py out out/tables
          run python3 tools/tables/pl_a1.py out out/tables
          run python3 tools/tables/pl_a2.py out out/tables
          run python3 tools/tables/tunnels.py tools/tables/transcribed out out/tables
          run python3 tools/tables/es_ausol.py out out/tables
          run python3 tools/tables/gb_london.py out out/tables
          run python3 tools/tables/ro_bridges.py out out/tables
          run python3 tools/tables/es_castellana.py out out/tables
          run python3 tools/tables/es_aulesa.py out out/tables
          run python3 tools/tables/it.py tools/tables/transcribed out out/tables
          run python3 tools/tables/it_cas.py out out/tables
          run python3 tools/tables/it_barriers.py out out/tables
          run python3 tools/tables/es_ministry.py out out/tables
          run python3 tools/tables/m6toll.py out out/tables
          run python3 tools/tables/ba.py out out/tables
          run python3 tools/tables/al.py out out/tables
          run python3 tools/tables/ba_rs.py tools/tables/transcribed out out/tables
          run python3 tools/tables/md.py out out/tables
          run python3 tools/tables/no_charge.py out out/tables
          run python3 tools/tables/es_regional.py out out/tables
          run python3 tools/tables/es_basque.py out out/tables
          run python3 tools/tables/es_ap53.py out out/tables
          run python3 tools/tables/es_radials.py out out/tables
          run python3 tools/tables/es_basque_ap8.py out out/tables
          run python3 tools/tables/es_ap68.py out out/tables
          run python3 tools/tables/rs.py out out/tables
          run python3 tools/tables/rs_bypass.py out out/tables
      - name: Convert to ORCT
        # The tables become ORCT datasets right away; only those are kept
        # (tariffs/data).
        run: |
          mkdir -p tables-only && cp out/tables/*.json tables-only/ && rm -f tables-only/hu-annex1.json
          python3 tools/orct/convert.py tables-only out/orct --commit "$GITHUB_SHA"
          python3 tools/orct/check_lossless.py tables-only out/orct
          rm -rf tables-only
      - name: Compare with the committed datasets
        run: |
          cmp -s out/tables/hu-annex1.json tools/roads/hu-annex1.json && echo "hu-annex1.json: same as committed" || echo "::warning title=hu-annex1.json::differs from tools/roads/hu-annex1.json"
          cmp -s out/ferries/crossings-islands.json ferries/data/crossings-islands.json && echo "crossings-islands.json: same as committed" || echo "::warning title=crossings-islands.json::differs from ferries/data/crossings-islands.json"
          cmp -s out/ferries/crossings-ships.json ferries/data/crossings-ships.json && echo "crossings-ships.json: same as committed" || echo "::warning title=crossings-ships.json::differs from ferries/data/crossings-ships.json"
          cmp -s out/ferries/ets-surcharges.json ferries/data/ets-surcharges.json && echo "ets-surcharges.json: same as committed" || echo "::warning title=ets-surcharges.json::differs from ferries/data/ets-surcharges.json (a new month's surcharges)"
          sh tools/orct/compare.sh out/orct | tee out/tables/compare.txt
          cd out/tables
          python3 ../../tools/tables/check_transcribed.py .. ../../tools/fr/transcribed | tee -a compare.txt
          python3 ../../tools/tables/check_transcribed.py .. ../../tools/tables/transcribed | tee -a compare.txt
          python3 ../../tools/tables/check_bans.py .. ../../bans/data | tee -a compare.txt
          # The tariffs that run out within 45 days with nothing after them.
          python3 ../../tools/tables/expiring.py ../../tariffs/data/index.json 45 | tee -a compare.txt
      - name: Push
        # Also when a builder failed, but not when the run was cancelled or
        # timed out before the datasets were converted: a partial out/
        # would replace the last full tables-out the other workflows read.
        if: ${{ !cancelled() }}
        run: |
          [ -d out/orct ] || { echo "::error title=Push::no datasets converted; tables-out kept as it was"; exit 1; }
          # Pages that carry a Mapbox access token (pk. or sk.) in their scripts (veggjald.is):
          # GitHub's push protection refuses the push, so the token is cut
          # from the copy (the builders don't read it).
          grep -rlZaE '[ps]k\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' out | xargs -0 -r sed -i -E 's/([ps]k)\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/\1.[token removed]/g'
          cd out
          git init -q -b tables-out && git add -A
          git -c user.name=actions -c user.email=actions@github.com commit -qm "Rate table sources"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tables-out
      - name: Builders that failed
        if: always()
        run: if [ -s out/build-errors.txt ]; then cat out/build-errors.txt; exit 1; fi
